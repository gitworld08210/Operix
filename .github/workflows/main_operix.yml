# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - Operix

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      # Pin Node 20 explicitly. The unit-test script uses
      # `node --experimental-strip-types`, a flag REMOVED in Node 22+, so newer
      # runner Node crashes with "bad option: --experimental-strip-types".
      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Use `npm install` (not `npm ci`): this repo does not commit a
      # package-lock.json, and `npm ci` requires one.
      #
      # NOTE ON DEPLOYMENT MODEL: this app is deployed to Azure App Service as a
      # PLAIN Next.js app. next.config.js does NOT set `output: "standalone"`,
      # so there is no `.next/standalone/server.js`; the app is started with
      # `next start` (via `npm start`). We build here to fail fast on compile
      # errors, then ship the source + built `.next` and let App Service run it.
      - name: npm install and build
        run: |
          npm install
          npm run build --if-present

      # Unit tests are informational and must NOT block the deploy.
      - name: Unit tests (non-blocking)
        run: npm run test:unit --if-present || echo "::warning::unit tests failed or were skipped; continuing with deploy"

      # Prune dev dependencies so the deployed node_modules is production-only,
      # then package everything App Service needs to run `next start`:
      # the app source, the built `.next`, node_modules, and the manifests.
      - name: Prepare production package
        run: |
          npm prune --omit=dev
          mkdir deploy
          cp -r .next deploy/.next
          cp -r node_modules deploy/node_modules
          cp -r src deploy/src
          if [ -d public ]; then cp -r public deploy/public; fi
          cp package.json deploy/package.json
          cp next.config.js deploy/next.config.js
          # A web.config is not needed for Linux App Service; Oryx/oryx-less
          # startup uses the startup-command set on the deploy step.

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build
    # No id-token permission needed: we authenticate with a publish profile
    # (AZURE_WEBAPP_PUBLISH_PROFILE secret), not OIDC/federated login. This
    # avoids the AADSTS700016 "application not found in directory" failure that
    # broke the OIDC azure/login step.
    permissions:
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Magnetism'
          slot-name: 'Production'
          # Authenticate with the downloaded publish profile stored as a repo
          # secret (Portal -> App Service -> Overview -> Download publish profile).
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          # NOTE: `startup-command` is NOT supported by webapps-deploy@v3 when
          # authenticating with a publish profile — it errors out. The startup
          # command ('npm run start') must instead be set once in the Portal:
          # App Service -> Configuration -> General settings -> Startup Command.
          package: .
